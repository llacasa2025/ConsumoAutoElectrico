<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumo Auto Eléctrico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>⚡ Consumo Auto Eléctrico</h1>
<p>Registro y cálculo de consumo de carga eléctrica</p>
</header>

<form id="formCarga" novalidate>
<div class="campo">
<label for="fecha">Fecha</label>
<input type="date" id="fecha" name="fecha" required>
</div>
<div class="campo">
<label for="kilometraje">Kilometraje actual (km)</label>
<input type="number" id="kilometraje" name="kilometraje" min="0" step="1" required>
</div>
<div class="campo">
<label for="kw">Carga en kW</label>
<input type="number" id="kw" name="kw" min="0" step="0.01" required>
</div>
<div class="campo">
<label for="costoCarga">Costo de la carga</label>
<input type="number" id="costoCarga" name="costoCarga" min="0" step="0.01" required>
</div>
<div class="campo">
<label for="costoConexion">Costo de la conexión</label>
<input type="number" id="costoConexion" name="costoConexion" min="0" step="0.01" required>
</div>
<div class="campo">
<label for="iva">IVA (%)</label>
<input type="number" id="iva" name="iva" min="0" step="0.01" value="21" required>
</div>
<button type="submit" id="btnGuardar">Guardar carga</button>
</form>

<div class="resultado" id="resultado" style="display:none;">
<h3>Resultado de la carga</h3>
<p id="txtSubtotal"><strong>Subtotal:</strong> <span id="valSubtotal"></span></p>
<p id="txtIva"><strong>IVA:</strong> <span id="valIva"></span></p>
<p id="txtTotal"><strong>Total:</strong> <span id="valTotal"></span></p>
<p id="txtCostoKw"><strong>Costo por kW:</strong> <span id="valCostoKw"></span></p>
</div>

<h2>Historial de cargas</h2>
<div id="listaHistorial" class="historial"></div>
<p id="totalesAcumulados" class="totales"></p>

<div class="respaldos">
<h3>Respaldos de datos</h3>
<button id="btnExportar">Exportar a JSON</button>
<input type="file" id="archivoImportar" accept=".json">
<p class="aviso">Los datos se guardan en tu navegador. Exporta el JSON para hacer respaldo y no perderlos.</p>
</div>

</div>
<script src="app.js"></script>
</body>
</html>
